project_id = "cuebooker"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.get-public-artist-profile]
verify_jwt = false

[functions.submit-booking-request]
verify_jwt = false

[functions.booking-follow-up]
verify_jwt = false

[functions.ingest-booking-email]
verify_jwt = false

[functions.dispatch-notification-emails]
verify_jwt = false

[functions.brevo-transactional-events]
verify_jwt = false

# GET callback uses an expiring single-use state; POST validates Auth identity.
[functions.connected-mailbox]
verify_jwt = false

# Public provider callback; POST requires raw-body HMAC authentication.
[functions.nylas-mailbox-events]
verify_jwt = false

# Scheduled/operator callback requires MAILBOX_WORKER_SECRET and explicit server gate.
[functions.process-mailbox-incoming]
verify_jwt = false
