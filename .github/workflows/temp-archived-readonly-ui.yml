name: TEMP archived readonly UI

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-archived-readonly-ui.yml
      - scripts/temp_archived_readonly_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch archived read-only UI
        run: python scripts/temp_archived_readonly_ui.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/BookingCoreInbox.vue
          git commit -m "Make archived bookings read only"
          git push origin HEAD:feature/app-visual-system
