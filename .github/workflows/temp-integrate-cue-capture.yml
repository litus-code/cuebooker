name: TEMP integrate CUE capture

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-integrate-cue-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch workspace integration
        run: python scripts/temp_integrate_cue_capture.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue
          git commit -m "Integrate fast CUE capture into workspace"
          git push origin HEAD:feature/app-visual-system
