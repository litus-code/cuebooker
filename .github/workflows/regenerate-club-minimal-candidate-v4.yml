name: Regenerate Club Minimal candidate v4

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/regenerate-club-minimal-candidate-v4.yml
      - scripts/generate-cue-id-club-minimal-candidate.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install trimesh numpy

      - name: Generate candidate
        run: python scripts/generate-cue-id-club-minimal-candidate.py

      - name: Verify budget
        run: |
          test "$(wc -c < public/cue-id/candidates/club-minimal-candidate-v1.glb)" -lt 1000000
          python - <<'PY'
          import json
          data=json.load(open('public/cue-id/candidates/club-minimal-candidate-v1.json'))
          assert data['triangles'] <= 35000
          assert data['materials'] <= 4
          assert data['textures'] <= 6
          PY

      - name: Commit regenerated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cue-id/candidates/club-minimal-candidate-v1.glb public/cue-id/candidates/club-minimal-candidate-v1.json
          git commit -m "test: regenerate Club Minimal candidate v4"
          git push origin HEAD:feature/app-visual-system
