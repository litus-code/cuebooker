name: TEMP real Booking Core filters and history

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-real-booking-filters-history.yml
      - scripts/temp_real_booking_filters_history.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch real booking filters/history
        run: python scripts/temp_real_booking_filters_history.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/services/bookingCoreApi.ts app/components/BookingCoreInbox.vue app/pages/workspace.vue
          git commit -m "Add real booking filters history and artist scoping"
          git push origin HEAD:feature/app-visual-system
