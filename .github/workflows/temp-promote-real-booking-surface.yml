name: TEMP promote real booking surface

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-promote-real-booking-surface.yml
      - scripts/temp_promote_real_booking_surface.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Promote real booking surface
        run: python scripts/temp_promote_real_booking_surface.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue app/components/BookingCoreInbox.vue
          git commit -m "Promote real booking surface over demo"
          git push origin HEAD:feature/app-visual-system
