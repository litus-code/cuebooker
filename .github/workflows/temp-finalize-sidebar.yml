name: TEMP finalize collapsible sidebar

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-finalize-sidebar.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0

      - name: Finalize sidebar CSS and labels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          css = Path('assets/css/workspace-responsive-final.css')
          text = css.read_text()
          marker = "@media (min-width: 961px) {\n  .workspace,"
          replacement = "@media (min-width: 961px) {\n  .workspace-header {\n    overflow: visible !important;\n  }\n\n  .workspace,"
          if marker not in text:
              raise SystemExit('Missing desktop responsive marker')
          text = text.replace(marker, replacement, 1)
          invalid = "\n  .workspace--sidebar-collapsed > .editor-backdrop:has(.settings-panel) {\n    inset-left: var(--workspace-rail) !important;\n  }\n"
          text = text.replace(invalid, "\n")
          css.write_text(text)

          vue = Path('app/pages/workspace.vue')
          source = vue.read_text()
          title_map = {
            'data-workspace-view="overview"': ':title="copy.overview" data-workspace-view="overview"',
            'data-workspace-view="bookings"': ':title="copy.bookings" data-workspace-view="bookings"',
            'data-workspace-view="calendar"': ':title="copy.calendar" data-workspace-view="calendar"',
            'data-workspace-view="history"': ':title="copy.history" data-workspace-view="history"',
            'data-workspace-view="profile"': ':title="copy.profile" data-workspace-view="profile"',
            'data-workspace-view="settings"': ':title="copy.settings" data-workspace-view="settings"',
          }
          for old, new in title_map.items():
              if old not in source:
                  raise SystemExit(f'Missing nav target {old}')
              source = source.replace(old, new, 1)
          vue.write_text(source)
          PY

          rm .github/workflows/temp-finalize-sidebar.yml
          git diff --check

      - name: Commit final sidebar polish
        shell: bash
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/workspace-responsive-final.css app/pages/workspace.vue .github/workflows/temp-finalize-sidebar.yml
          git commit -m "Finalize collapsible workspace sidebar"
          git push origin HEAD:feature/app-visual-system
