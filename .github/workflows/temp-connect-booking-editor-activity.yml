name: TEMP connect Booking Core editor and activity

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-connect-booking-editor-activity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch Booking Core editor/activity integration
        run: python scripts/temp_connect_booking_editor_activity.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/services/bookingCoreApi.ts app/components/BookingCoreInbox.vue
          git commit -m "Connect real booking editor and quick activity"
          git push origin HEAD:feature/app-visual-system
