name: TEMP fix mobile booking focus

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-fix-booking-focus-mobile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply mobile focus patch
        run: python scripts/temp_fix_booking_focus_mobile.py
      - name: Validate build
        run: |
          npm ci
          npm run generate
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue assets/css/workspace-responsive-final.css
          git commit -m "Fix mobile booking focus and shrink profile controls"
          git push origin HEAD:feature/app-visual-system
