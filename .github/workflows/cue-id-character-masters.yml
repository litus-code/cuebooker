name: CUE ID Character Masters

on:
  workflow_dispatch:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - scripts/blender/cue-id-studio-character-master.py
      - .github/workflows/cue-id-character-masters.yml

permissions:
  contents: read

jobs:
  build-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLENDER_ARCHIVE: blender-5.2.2-linux-x64.tar.xz
      BLENDER_DIR: blender-5.2.2-linux-x64
      BASE_MESH_BUNDLE_URL: https://download.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip

    steps:
      - name: Install headless render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libglu1-mesa xvfb unzip

      - uses: actions/checkout@v4

      - name: Cache Blender Studio base mesh bundle
        id: base-cache
        uses: actions/cache@v4
        with:
          path: /tmp/human-base-meshes-bundle-v1.4.1.zip
          key: cue-id-blender-human-base-meshes-v1.4.1

      - name: Download official CC0 base mesh bundle
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$BASE_MESH_BUNDLE_URL" -o /tmp/human-base-meshes-bundle-v1.4.1.zip

      - name: Extract base mesh bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/human-base-meshes
          mkdir -p /tmp/human-base-meshes
          unzip -q /tmp/human-base-meshes-bundle-v1.4.1.zip -d /tmp/human-base-meshes

      - name: Install Blender
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://download.blender.org/release/Blender5.2/$BLENDER_ARCHIVE" -o "/tmp/$BLENDER_ARCHIVE"
          tar -xf "/tmp/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP"

      - name: Build male master
        run: |
          set -euo pipefail
          mkdir -p artifacts/character-masters/male
          BLEND_FILE="$(find /tmp/human-base-meshes -type f -name 'human_base_meshes_bundle.blend' | head -1)"
          test -n "$BLEND_FILE"
          BLENDER="$RUNNER_TEMP/$BLENDER_DIR/blender"
          xvfb-run -a "$BLENDER" --background \
            --python scripts/blender/cue-id-studio-character-master.py \
            -- \
            --blend "$BLEND_FILE" \
            --body male \
            --output "$GITHUB_WORKSPACE/artifacts/character-masters/male/source-male-master.blend"
          python -m json.tool artifacts/character-masters/male/source-male-master.studio-report.json

      - name: Build female master
        run: |
          set -euo pipefail
          mkdir -p artifacts/character-masters/female
          BLEND_FILE="$(find /tmp/human-base-meshes -type f -name 'human_base_meshes_bundle.blend' | head -1)"
          test -n "$BLEND_FILE"
          BLENDER="$RUNNER_TEMP/$BLENDER_DIR/blender"
          xvfb-run -a "$BLENDER" --background \
            --python scripts/blender/cue-id-studio-character-master.py \
            -- \
            --blend "$BLEND_FILE" \
            --body female \
            --output "$GITHUB_WORKSPACE/artifacts/character-masters/female/source-female-master.blend"
          python -m json.tool artifacts/character-masters/female/source-female-master.studio-report.json

      - name: Upload character masters
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-character-masters
          path: artifacts/character-masters/
          if-no-files-found: error
          retention-days: 14
