name: TEMP mobile UX pass

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-mobile-ux-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply patch script
        run: python scripts/temp_mobile_ux_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue assets/css/workspace-responsive-final.css
          git commit -m "Polish mobile booking calendar profile and history UX"
          git push origin HEAD:feature/app-visual-system
