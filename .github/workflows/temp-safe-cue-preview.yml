name: TEMP safe CUE preview

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-safe-cue-preview.yml
      - scripts/temp_safe_cue_preview.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply safe CUE preview
        run: python scripts/temp_safe_cue_preview.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/CueCapturePanel.vue
          git commit -m "Add review step to CUE interpretation"
          git push origin HEAD:feature/app-visual-system
