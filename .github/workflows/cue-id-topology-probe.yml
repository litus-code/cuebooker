name: CUE ID topology probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - scripts/blender/cue-id-creator-v1-topology-probe.py
      - .github/workflows/cue-id-topology-probe.yml

permissions:
  contents: read

jobs:
  compare-topologies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_ARCHIVE: blender-5.2.2-linux-x64.tar.xz
      BLENDER_DIR: blender-5.2.2-linux-x64
      SYSTEM_ASSETS_URL: https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://download.blender.org/release/Blender5.2/$BLENDER_ARCHIVE" -o "/tmp/$BLENDER_ARCHIVE"
          tar -xf "/tmp/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP"

      - name: Install MPFB
        run: |
          set -euo pipefail
          BLENDER="$RUNNER_TEMP/$BLENDER_DIR/blender"
          "$BLENDER" --online-mode --command extension install -s -e mpfb
          "$BLENDER" --command extension list | grep -i mpfb

      - name: Download CC0 system assets
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SYSTEM_ASSETS_URL" -o /tmp/makehuman_system_assets_cc0.zip
          test -s /tmp/makehuman_system_assets_cc0.zip

      - name: Render comparison
        run: |
          set -euo pipefail
          mkdir -p artifacts/topology-probe
          BLENDER="$RUNNER_TEMP/$BLENDER_DIR/blender"
          "$BLENDER" --background             --python scripts/blender/cue-id-creator-v1-topology-probe.py             --             --asset-pack /tmp/makehuman_system_assets_cc0.zip             --output-dir "$GITHUB_WORKSPACE/artifacts/topology-probe"
          python -m json.tool artifacts/topology-probe/topology-probe-report.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-creator-v1-topology-probe
          path: artifacts/topology-probe/
          if-no-files-found: error
          retention-days: 14
