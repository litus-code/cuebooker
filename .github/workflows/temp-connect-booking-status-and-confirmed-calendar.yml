name: TEMP connect booking status and confirmed calendar

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-connect-booking-status-and-confirmed-calendar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch Booking Core status and calendar
        run: python scripts/temp_connect_booking_status_and_confirmed_calendar.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/services/bookingCoreApi.ts app/components/BookingCoreInbox.vue app/pages/workspace.vue
          git commit -m "Connect traced booking status and confirmed calendar"
          git push origin HEAD:feature/app-visual-system
