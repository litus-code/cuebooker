name: TEMP fix booking scroll and brand axis

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-fix-mobile-booking-scroll-brand-axis.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp_fix_mobile_booking_scroll_and_brand_axis.py
      - name: Validate build
        run: |
          npm ci
          npm run generate
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue assets/css/workspace-responsive-final.css
          git commit -m "Fix mobile booking scroll and collapsed brand axis"
          git push origin HEAD:feature/app-visual-system
