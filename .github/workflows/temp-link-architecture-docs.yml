name: TEMP link architecture docs

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-link-architecture-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Link architecture documentation
        run: python scripts/temp_link_architecture_docs.py
      - name: Commit documentation links
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/WORK_HANDOFF_2026-09-16.md docs/BOOKING_CORE_PRODUCT_VISION.md
          git commit -m "Link architecture baseline from product handoff"
          git push origin HEAD:feature/app-visual-system
