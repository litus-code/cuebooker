name: TEMP compact profile mobile controls

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-compact-profile-mobile-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply compact mobile controls
        run: python scripts/temp_compact_profile_mobile_controls.py
      - name: Validate build
        run: |
          npm ci
          npm run generate
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/workspace-responsive-final.css
          git commit -m "Compact profile artist controls on mobile"
          git push origin HEAD:feature/app-visual-system
