name: TEMP mobile visual fix

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-mobile-visual-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp_mobile_visual_fix.py
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue assets/css/workspace-responsive-final.css
          git commit -m "Refine mobile booking scroll calendar accent and profile preview"
          git push origin HEAD:feature/app-visual-system
