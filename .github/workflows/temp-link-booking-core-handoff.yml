name: TEMP link booking core handoff

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-link-booking-core-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Link booking core vision from handoff
        run: python scripts/temp_link_booking_core_handoff.py
      - name: Commit handoff update
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/WORK_HANDOFF_2026-09-16.md
          git commit -m "Link booking core vision from work handoff"
          git push origin HEAD:feature/app-visual-system
