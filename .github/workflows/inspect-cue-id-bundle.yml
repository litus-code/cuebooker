name: Inspect CUE ID bundle boundary

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/inspect-cue-id-bundle.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect final lazy 3D chunks
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'
          import { resolve, basename } from 'node:path'

          const dir = resolve('.output/public/_nuxt')
          const files = readdirSync(dir)
            .filter(name => name.endsWith('.js'))
            .map(name => {
              const path = resolve(dir, name)
              const source = readFileSync(path, 'utf8')
              return {
                name,
                path,
                source,
                bytes: statSync(path).size,
                gzipBytes: gzipSync(source).byteLength
              }
            })

          const markers = [
            'THREE.WebGLRenderer',
            'WebGLRenderer',
            'GLTFLoader',
            'failIfMajorPerformanceCaveat',
            'KHR_draco_mesh_compression',
            'CueIdScene'
          ]

          const matches = files
            .map(file => ({
              ...file,
              markers: markers.filter(marker => file.source.includes(marker))
            }))
            .filter(file => file.markers.length)

          console.log('CUE_ID_3D_MATCHES')
          for (const file of matches) {
            console.log(JSON.stringify({
              file: file.name,
              bytes: file.bytes,
              gzipBytes: file.gzipBytes,
              markers: file.markers
            }))
          }

          console.log('TOP_CLIENT_JS')
          for (const file of [...files].sort((a, b) => b.bytes - a.bytes).slice(0, 12)) {
            console.log(JSON.stringify({
              file: file.name,
              bytes: file.bytes,
              gzipBytes: file.gzipBytes
            }))
          }

          if (!matches.length) {
            console.error('No final client chunk containing 3D runtime markers was found')
            process.exit(1)
          }
          NODE
