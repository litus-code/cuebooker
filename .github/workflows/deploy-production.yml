name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA already reviewed in staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cuebooker.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://cuebooker.com

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Verify revision belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "The requested revision is not contained in main. Aborting."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate production build
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_APP_ENV: production
        run: npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=cuebooker-production --branch=main --commit-hash=${{ inputs.git_ref }}

      - name: Record deployed revision
        run: |
          echo "Production revision: ${{ inputs.git_ref }}"
          echo "Production: https://cuebooker.com"
