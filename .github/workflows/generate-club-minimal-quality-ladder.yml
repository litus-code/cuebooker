name: Generate Club Minimal quality ladder

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/generate-club-minimal-quality-ladder.yml
      - scripts/generate-cue-id-club-minimal-candidate.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install trimesh numpy

      - name: Generate all quality levels
        run: |
          python scripts/generate-cue-id-club-minimal-candidate.py --quality light
          python scripts/generate-cue-id-club-minimal-candidate.py --quality medium
          python scripts/generate-cue-id-club-minimal-candidate.py --quality high

      - name: Verify all quality budgets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
            Path('public/cue-id/candidates/club-minimal-candidate-v1.json'),
            Path('public/cue-id/candidates/club-minimal-candidate-medium-v1.json'),
            Path('public/cue-id/candidates/club-minimal-candidate-high-v1.json'),
          ]
          for path in files:
              data = json.loads(path.read_text())
              assert data['bytes'] <= 1_000_000, data
              assert data['triangles'] <= 35_000, data
              assert data['materials'] <= 4, data
              assert data['textures'] <= 6, data
              print(path.name, data)
          PY

      - name: Commit generated ladder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cue-id/candidates/club-minimal-candidate-v1.glb public/cue-id/candidates/club-minimal-candidate-v1.json
          git add public/cue-id/candidates/club-minimal-candidate-medium-v1.glb public/cue-id/candidates/club-minimal-candidate-medium-v1.json
          git add public/cue-id/candidates/club-minimal-candidate-high-v1.glb public/cue-id/candidates/club-minimal-candidate-high-v1.json
          git commit -m "test: generate Club Minimal quality ladder"
          git push origin HEAD:feature/app-visual-system
