name: Sync Supabase Auth Email Templates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-supabase-auth-mail-templates
  cancel-in-progress: false

jobs:
  sync:
    name: Copy staging templates to production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Management API access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing production environment secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Copy and verify Auth email templates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SOURCE_SUPABASE_PROJECT_REF: lycprjeuuynfzwskycwv
          TARGET_SUPABASE_PROJECT_REF: qlocooqfdzehogbwcbhr
        run: node scripts/sync-supabase-auth-mail-templates.mjs
