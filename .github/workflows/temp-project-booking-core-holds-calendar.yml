name: TEMP project Booking Core holds into calendar

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-project-booking-core-holds-calendar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch calendar projection
        run: python scripts/temp_project_booking_core_holds_calendar.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue
          git commit -m "Project Booking Core holds into calendar"
          git push origin HEAD:feature/app-visual-system
