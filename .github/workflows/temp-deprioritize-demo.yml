name: TEMP deprioritize demo

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-deprioritize-demo.yml
      - scripts/temp_deprioritize_demo.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Patch demo de-prioritization
        run: python scripts/temp_deprioritize_demo.py
      - name: Install
        run: npm ci
      - name: Generate
        run: npm run generate
      - name: Commit integration
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue
          git commit -m "Make real Booking Core the primary workspace flow"
          git push origin HEAD:feature/app-visual-system
