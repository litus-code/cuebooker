name: Temp integrate public profile workspace

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-integrate-public-profile-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0

      - name: Apply guarded integration
        run: python scripts/temp_integrate_public_profile_workspace.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate production build
        env:
          NUXT_APP_BASE_URL: /
        run: npm run generate

      - name: Verify expected integration
        shell: bash
        run: |
          grep -q "const publicPublishing = usePublicArtistPublishing()" app/pages/workspace.vue
          grep -q "<PublicProfilePublishingControls" app/pages/workspace.vue
          grep -q "<PublicArtistProfile" app/pages/workspace.vue
          grep -q "publicProfilePreview" app/pages/workspace.vue
          if grep -q "profile-preview-hero" app/pages/workspace.vue; then
            echo "Old preview template marker still present" >&2
            exit 1
          fi

      - name: Remove temporary helpers and commit integration
        shell: bash
        run: |
          rm -f scripts/temp_integrate_public_profile_workspace.py
          rm -f .github/workflows/temp-integrate-public-profile-workspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pages/workspace.vue app/components/PublicProfilePublishingControls.vue scripts/temp_integrate_public_profile_workspace.py .github/workflows/temp-integrate-public-profile-workspace.yml
          git diff --cached --check
          git commit -m "Integrate public artist profile into workspace"
          git push origin HEAD:feature/app-visual-system
