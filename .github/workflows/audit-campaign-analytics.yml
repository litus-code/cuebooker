name: Audit Production Campaign Analytics (read only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type cuebooker-production-readonly (no events, writes or deployments)
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed 40-character main SHA to audit from
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cuebooker-production-campaign-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'cuebooker-production-readonly' && inputs.reviewed_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install PostgreSQL client (no database credentials in this step)
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Read aggregates twice without writing or sending test events
        env:
          CUEBOOKER_BACKUP_DB_URL: ${{ secrets.CUEBOOKER_BACKUP_DB_URL }}
          CUEBOOKER_AUDIT_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          CUEBOOKER_AUDIT_REVISION: ${{ github.sha }}
        run: python3 scripts/audit-campaign-analytics.py
