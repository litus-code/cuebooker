name: Capture CUE ID visual comparison

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/capture-cue-id-visual-comparison.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright browser
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium

      - name: Capture real GLB desktop/mobile stages
        run: |
          mkdir -p /tmp/cue-id-visual
          cd /tmp/cue-id-visual
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > capture.cjs <<'EOF'
const { chromium } = require('playwright');

async function capture({ width, height, name }) {
  const browser = await chromium.launch({ headless: true });
  const page = await browser.newPage({ viewport: { width, height } });
  await page.goto('https://pr-75.cuebooker-staging.pages.dev/cue-id', { waitUntil: 'networkidle' });

  const accept = page.getByRole('button', { name: /Aceptar cookies|Accept cookies/i });
  if (await accept.count()) {
    await accept.first().click().catch(() => {});
  }

  const stage = page.locator('.cue-id-stage');
  await stage.scrollIntoViewIfNeeded();
  await page.waitForTimeout(500);

  await page.waitForFunction(() => {
    const diagnostic = document.querySelector('.cue-id-stage__diagnostics');
    if (!diagnostic) return false;
    const text = diagnostic.textContent || '';
    return /asset\s+club-minimal-candidate/i.test(text) && !/ready\s+—/.test(text);
  }, { timeout: 15000 }).catch(() => {});

  await page.waitForTimeout(1200);
  await stage.screenshot({ path: name });
  await browser.close();
}

(async () => {
  await capture({ width: 1440, height: 1000, name: 'cue-id-desktop-auto.png' });
  await capture({ width: 390, height: 844, name: 'cue-id-mobile-auto.png' });
})().catch(error => {
  console.error(error);
  process.exit(1);
});

          EOF
          node capture.cjs
          mv cue-id-desktop-auto.png "$GITHUB_WORKSPACE/"
          mv cue-id-mobile-auto.png "$GITHUB_WORKSPACE/"

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-visual-comparison
          path: |
            cue-id-desktop-auto.png
            cue-id-mobile-auto.png
          if-no-files-found: error
          retention-days: 1
