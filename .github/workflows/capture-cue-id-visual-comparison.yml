name: Capture CUE ID visual comparison

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/capture-cue-id-visual-comparison.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright browser
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Capture real GLB desktop/mobile stages
        run: |
          mkdir -p /tmp/cue-id-visual
          cd /tmp/cue-id-visual
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          echo '' | base64 -d > capture.cjs
          node capture.cjs
          mv cue-id-desktop-auto.png "$GITHUB_WORKSPACE/"
          mv cue-id-mobile-auto.png "$GITHUB_WORKSPACE/"

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-visual-comparison
          path: |
            cue-id-desktop-auto.png
            cue-id-mobile-auto.png
          if-no-files-found: error
          retention-days: 1
