name: Capture CUE ID visual comparison

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/capture-cue-id-visual-comparison.yml
      - scripts/capture-cue-id-visual.cjs

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture real GLB desktop/mobile stages
        run: node scripts/capture-cue-id-visual.cjs

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-visual-comparison
          path: |
            cue-id-desktop-auto.png
            cue-id-mobile-auto.png
          if-no-files-found: error
          retention-days: 1
