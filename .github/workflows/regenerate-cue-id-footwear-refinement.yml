name: Regenerate CUE ID footwear refinement

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - scripts/generate-cue-id-club-minimal-candidate.py
      - .github/workflows/regenerate-cue-id-footwear-refinement.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-visual-system
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy trimesh scipy
      - name: Regenerate candidates
        run: |
          python scripts/generate-cue-id-club-minimal-candidate.py --quality light
          python scripts/generate-cue-id-club-minimal-candidate.py --quality medium
          python scripts/generate-cue-id-club-minimal-candidate.py --quality high
      - name: Commit generated candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cue-id/candidates/club-minimal-candidate-v1.glb \
                  public/cue-id/candidates/club-minimal-candidate-v1.json \
                  public/cue-id/candidates/club-minimal-candidate-medium-v1.glb \
                  public/cue-id/candidates/club-minimal-candidate-medium-v1.json \
                  public/cue-id/candidates/club-minimal-candidate-high-v1.glb \
                  public/cue-id/candidates/club-minimal-candidate-high-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "regenerate CUE ID footwear refinement"
          git push
