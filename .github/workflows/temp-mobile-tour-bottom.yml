name: TEMP mobile tour bottom

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-mobile-tour-bottom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp_mobile_tour_bottom.py
      - name: Validate build
        run: |
          npm ci
          npm run generate
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue assets/css/workspace-responsive-final.css
          git commit -m "Stabilize mobile guided tour as bottom sheet"
          git push origin HEAD:feature/app-visual-system
