name: TEMP add booking toolbar breathing

on:
  push:
    branches:
      - feature/app-visual-system

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-visual-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Apply patch
        run: python scripts/temp_add_booking_toolbar_breathing.py
      - name: Validate
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name cuebooker-workspace-bot
          git config user.email actions@users.noreply.github.com
          git add assets/css/workspace-responsive-final.css
          git diff --cached --quiet || git commit -m "Add breathing to desktop booking toolbar"
          git push origin HEAD:feature/app-visual-system
