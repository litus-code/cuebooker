name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging.cuebooker.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.cuebooker.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate staging build
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_APP_ENV: staging
        run: npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=cuebooker-staging --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"

      - name: Record deployed revision
        run: |
          echo "Staging revision: $GITHUB_SHA"
          echo "Review: https://staging.cuebooker.com"
