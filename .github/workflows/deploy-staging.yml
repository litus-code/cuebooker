name: Deploy Staging

on:
  push:
    branches:
      - feature/app-visual-system
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging.cuebooker.com
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.cuebooker.com

    steps:
      - name: Resolve deployment revision
        id: revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate staging build
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_APP_ENV: staging
          NUXT_PUBLIC_GTM_ID: GTM-MHP8MGS3
          NUXT_PUBLIC_SUPABASE_URL: https://lycprjeuuynfzwskycwv.supabase.co
          NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EB86PM_vk7lZlJH7hadGlg_YMt-c2d9
        run: npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=cuebooker-staging --branch=main --commit-hash=${{ steps.revision.outputs.sha }}

      - name: Record deployed revision
        run: |
          echo "Staging revision: ${{ steps.revision.outputs.sha }}"
          echo "Review: https://staging.cuebooker.com"

  preview:
    name: Deploy PR preview
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref_name == 'feature/app-visual-system') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve preview revision
        id: preview
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "url=https://pr-${{ github.event.pull_request.number }}.cuebooker-staging.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=pr-75" >> "$GITHUB_OUTPUT"
            echo "url=https://pr-75.cuebooker-staging.pages.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout preview revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare preview secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required repository secret: $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate preview build
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_APP_ENV: staging
          NUXT_PUBLIC_GTM_ID: GTM-MHP8MGS3
          NUXT_PUBLIC_SUPABASE_URL: https://lycprjeuuynfzwskycwv.supabase.co
          NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EB86PM_vk7lZlJH7hadGlg_YMt-c2d9
        run: npm run generate

      - name: Deploy PR preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=cuebooker-staging --branch=${{ steps.preview.outputs.branch }} --commit-hash=${{ steps.preview.outputs.sha }}

      - name: Record preview URL
        run: |
          echo "Preview revision: ${{ steps.preview.outputs.sha }}"
          echo "Preview: ${{ steps.preview.outputs.url }}"
