name: TEMP detach workspace demo state

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-align-booking-origin-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@10.9.3
      - name: Detach workspace from demo state
        run: python scripts/temp_align_booking_origin_capture.py
      - name: Guard demo coupling
        shell: bash
        run: |
          if grep -Eq 'showSampleMode|selectedDemoBookingId|useBookingDemo\(' app/pages/workspace.vue; then
            echo 'Workspace still depends on demo state'
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Generate
        env:
          NUXT_APP_BASE_URL: /
        run: npm run generate
      - name: Commit
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/pages/workspace.vue app/components/BookingCoreInbox.vue
          git commit -m "Make Booking Core the primary workspace surface"
          git push origin HEAD:feature/app-visual-system
