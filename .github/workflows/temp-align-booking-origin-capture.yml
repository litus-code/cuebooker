name: TEMP align booking origin capture

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-align-booking-origin-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp_align_booking_origin_capture.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Generate
        run: npm run generate
      - name: Commit
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/services/bookingCoreApi.ts
          git commit -m "Align Booking Core API with origin capture split"
          git push origin HEAD:feature/app-visual-system
