name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate lockfile
        shell: bash
        run: |
          pwd
          ls -la package.json package-lock.json
          node -e "const fs=require('fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); console.log({lockfileVersion: lock.lockfileVersion, rootPackage: lock.packages?.['']?.name})"
          npm config get package-lock

      - name: Install dependencies
        run: npm ci

      - name: Generate production build
        env:
          NUXT_APP_BASE_URL: /
        run: npm run generate
