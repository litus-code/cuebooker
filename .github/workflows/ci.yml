name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.3

      - name: Rebuild lockfile for dependency refresh
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'chore/deterministic-ci-installs' || github.head_ref == 'feature/cue-id-3d') }}
        shell: bash
        run: |
          echo "Rebuilding package-lock.json from package.json with npm $(npm --version)"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          node -e "const fs=require('fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); console.log({lockfileVersion: lock.lockfileVersion, rootPackage: lock.packages?.['']?.name})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "Regenerate package lockfile with npm 10.9.3"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Integrate CUE ID stage into artist visual profile
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/cue-id-3d' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/components/ProfileCoverUploader.vue'
          let source = fs.readFileSync(path, 'utf8')
          if (!source.includes('<CueIdStage')) {
            const marker = `      <small v-if="artistMessage">{{ artistMessage }}</small>\n    </aside>\n\n    <div v-if="imageUrl" class="cover-uploader__controls">`
            const replacement = `      <small v-if="artistMessage">{{ artistMessage }}</small>\n    </aside>\n\n    <CueIdStage\n      :artist-name="activeArtist?.stage_name || ''"\n      :disabled="disabled"\n      compact\n      embedded\n    />\n\n    <div v-if="imageUrl" class="cover-uploader__controls">`
            if (!source.includes(marker)) throw new Error('Profile visual marker not found')
            source = source.replace(marker, replacement)
            fs.writeFileSync(path, source)
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ProfileCoverUploader.vue
          if git diff --cached --quiet; then
            echo "CUE ID stage already integrated"
          else
            git commit -m "Integrate CUE ID 3D into artist profile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate production build
        env:
          NUXT_APP_BASE_URL: /
        run: npm run generate
