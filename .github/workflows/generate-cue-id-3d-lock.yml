name: Generate CUE ID 3D lock

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/generate-cue-id-3d-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate dependency lock
        run: npm install --package-lock-only --save @tresjs/core three

      - name: Capture dependency patch
        run: |
          git diff -- package.json package-lock.json > cue-id-3d-deps.patch
          test -s cue-id-3d-deps.patch

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add minimal TresJS runtime dependencies"
          git push origin HEAD:feature/app-visual-system

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: cue-id-3d-lock-core
          path: |
            package.json
            package-lock.json
            cue-id-3d-deps.patch
          if-no-files-found: error
          retention-days: 1
