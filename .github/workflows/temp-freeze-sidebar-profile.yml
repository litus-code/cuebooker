name: TEMP freeze sidebar profile layout

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/temp-freeze-sidebar-profile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/app-visual-system
          fetch-depth: 0
      - name: Apply layout patch
        run: python scripts/temp_freeze_sidebar_profile_layout.py
      - name: Validate build
        run: |
          npm ci
          npm run generate
      - name: Commit patch
        run: |
          git config user.name "cuebooker-workspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/ProfileCoverUploader.vue assets/css/workspace-responsive-final.css
          git commit -m "Stabilize collapsed sidebar and profile layout"
          git push origin HEAD:feature/app-visual-system
