name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/rehearse-staging-campaign.yml'
      - 'scripts/rehearse-staging-campaign.py'
      - 'scripts/restore-backup-drill.py'
      - 'tests/stagingCampaignRehearsal.test.ts'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/restore-backup-drill.yml'
      - 'tests/restoreBackupDrill.test.ts'
      - 'docs/RELEASE_REHEARSAL_STATUS.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to litus-code.github.io/cuebooker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub Pages build
        env:
          NUXT_APP_BASE_URL: /cuebooker/
          NUXT_PUBLIC_APP_ENV: staging
        run: npm run generate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
