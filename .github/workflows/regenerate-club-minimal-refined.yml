name: Regenerate Club Minimal refined quality set

on:
  push:
    branches:
      - feature/app-visual-system
    paths:
      - .github/workflows/regenerate-club-minimal-refined.yml
      - scripts/generate-cue-id-club-minimal-candidate.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install trimesh numpy

      - name: Generate all qualities
        run: |
          python scripts/generate-cue-id-club-minimal-candidate.py --quality light
          python scripts/generate-cue-id-club-minimal-candidate.py --quality medium
          python scripts/generate-cue-id-club-minimal-candidate.py --quality high

      - name: Verify budget and material contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('club-minimal-candidate-v1','club-minimal-candidate-medium-v1','club-minimal-candidate-high-v1'):
              data=json.loads(Path(f'public/cue-id/candidates/{name}.json').read_text())
              assert data['triangles'] <= 35000
              assert data['bytes'] <= 1000000
              assert data['materials'] == 4
              assert data['embeddedMaterials'] == 4
              assert data['textures'] == 0
          PY

      - name: Commit regenerated quality set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cue-id/candidates/
          git commit -m "test: regenerate refined Club Minimal quality set"
          git push origin HEAD:feature/app-visual-system
