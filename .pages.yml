media:
  input: public/media
  output: /media

content:
  - name: spanish-home
    label: Web comercial, español
    type: file
    path: content/es/home.json
    format: json
    fields:
      - { name: seo, label: SEO, type: object, fields: [{ name: title, label: Título SEO, type: string }, { name: description, label: Descripción SEO, type: text }] }
      - { name: nav, label: Navegación, type: object, fields: [{ name: problem, label: El problema, type: string }, { name: product, label: Cómo funciona, type: string }, { name: roles, label: Para quién, type: string }, { name: earlyAccess, label: Acceso anticipado, type: string }, { name: workspace, label: Workspace, type: string }] }
      - { name: hero, label: Portada, type: object, fields: [{ name: eyebrow, label: Texto superior, type: string }, { name: titleTop, label: Título, type: string }, { name: titleBottom, label: Título destacado, type: string }, { name: body, label: Explicación, type: text }, { name: primaryCta, label: Botón principal, type: string }, { name: secondaryCta, label: Botón secundario, type: string }, { name: networkIdle, label: Estado inicial, type: string }, { name: networkSearching, label: Estado buscando, type: string }, { name: networkFound, label: Estado encontrado, type: string }] }
      - { name: problem, label: Problema, type: object, fields: [{ name: index, label: Índice, type: string }, { name: eyebrow, label: Texto superior, type: string }, { name: title, label: Título, type: string }, { name: body, label: Explicación, type: text }, { name: quoteOne, label: Mensaje inicial, type: string }, { name: quoteTwo, label: Seguimiento, type: string }, { name: file, label: Archivo, type: string }, { name: statement, label: Cierre, type: string }] }
      - { name: search, label: Buscador demo, type: object, fields: [{ name: index, label: Índice, type: string }, { name: eyebrow, label: Texto superior, type: string }, { name: title, label: Título, type: string }, { name: body, label: Explicación, type: text }, { name: where, label: Dónde, type: string }, { name: when, label: Cuándo, type: string }, { name: sound, label: Sonido, type: string }, { name: budget, label: Presupuesto, type: string }, { name: button, label: Botón, type: string }, { name: searching, label: Buscando, type: string }, { name: resultCount, label: Resultado, type: string }, { name: resultHint, label: Aviso demo, type: string }, { name: available, label: Disponible, type: string }, { name: request, label: Abrir artista, type: string }, { name: why, label: Motivos, type: string }, { name: reasons, label: Lista de motivos, type: string, list: true }] }
      - { name: flow, label: Flujo conectado, type: object, fields: [{ name: index, label: Índice, type: string }, { name: eyebrow, label: Texto superior, type: string }, { name: title, label: Título, type: string }, { name: body, label: Explicación, type: text }, { name: steps, label: Pasos, type: string, list: true }] }
      - { name: roles, label: Perfiles, type: object, fields: [{ name: index, label: Índice, type: string }, { name: eyebrow, label: Texto superior, type: string }, { name: title, label: Título, type: string }, { name: items, label: Perfiles, type: object, list: true, fields: [{ name: name, label: Nombre, type: string }, { name: headline, label: Titular, type: string }, { name: body, label: Explicación, type: text }] }] }
      - { name: cta, label: Acceso anticipado, type: object, fields: [{ name: eyebrow, label: Texto superior, type: string }, { name: title, label: Título, type: string }, { name: body, label: Explicación, type: text }, { name: button, label: Botón, type: string }, { name: email, label: Email, type: string }, { name: note, label: Nota, type: string }] }

  - name: english-home
    label: Commercial website, English
    type: file
    path: content/en/home.json
    format: json
    fields:
      - { name: seo, label: SEO, type: object, fields: [{ name: title, label: SEO title, type: string }, { name: description, label: SEO description, type: text }] }
      - { name: nav, label: Navigation, type: object, fields: [{ name: problem, label: Problem, type: string }, { name: product, label: Product, type: string }, { name: roles, label: Roles, type: string }, { name: earlyAccess, label: Early access, type: string }, { name: workspace, label: Workspace, type: string }] }
      - { name: hero, label: Hero, type: object, fields: [{ name: eyebrow, label: Eyebrow, type: string }, { name: titleTop, label: Title, type: string }, { name: titleBottom, label: Highlighted title, type: string }, { name: body, label: Body, type: text }, { name: primaryCta, label: Primary CTA, type: string }, { name: secondaryCta, label: Secondary CTA, type: string }, { name: networkIdle, label: Idle state, type: string }, { name: networkSearching, label: Searching state, type: string }, { name: networkFound, label: Found state, type: string }] }
      - { name: problem, label: Problem, type: object, fields: [{ name: index, label: Index, type: string }, { name: eyebrow, label: Eyebrow, type: string }, { name: title, label: Title, type: string }, { name: body, label: Body, type: text }, { name: quoteOne, label: First message, type: string }, { name: quoteTwo, label: Follow-up, type: string }, { name: file, label: File, type: string }, { name: statement, label: Statement, type: string }] }
      - { name: search, label: Discovery demo, type: object, fields: [{ name: index, label: Index, type: string }, { name: eyebrow, label: Eyebrow, type: string }, { name: title, label: Title, type: string }, { name: body, label: Body, type: text }, { name: where, label: Where, type: string }, { name: when, label: When, type: string }, { name: sound, label: Sound, type: string }, { name: budget, label: Budget, type: string }, { name: button, label: Button, type: string }, { name: searching, label: Searching, type: string }, { name: resultCount, label: Result, type: string }, { name: resultHint, label: Demo note, type: string }, { name: available, label: Available, type: string }, { name: request, label: Open artist, type: string }, { name: why, label: Reasons label, type: string }, { name: reasons, label: Reasons, type: string, list: true }] }
      - { name: flow, label: Connected flow, type: object, fields: [{ name: index, label: Index, type: string }, { name: eyebrow, label: Eyebrow, type: string }, { name: title, label: Title, type: string }, { name: body, label: Body, type: text }, { name: steps, label: Steps, type: string, list: true }] }
      - { name: roles, label: Roles, type: object, fields: [{ name: index, label: Index, type: string }, { name: eyebrow, label: Eyebrow, type: string }, { name: title, label: Title, type: string }, { name: items, label: Roles, type: object, list: true, fields: [{ name: name, label: Name, type: string }, { name: headline, label: Headline, type: string }, { name: body, label: Body, type: text }] }] }
      - { name: cta, label: Early access, type: object, fields: [{ name: eyebrow, label: Eyebrow, type: string }, { name: title, label: Title, type: string }, { name: body, label: Body, type: text }, { name: button, label: Button, type: string }, { name: email, label: Email, type: string }, { name: note, label: Note, type: string }] }

settings:
  content:
    merge: true
